name: Evals + ownership

on:
  push:
    branches: [main]
  pull_request:

jobs:
  evals:
    name: Eval harness (accuracy/latency/cost)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run eval harness
        run: python -m evals.run_evals --json eval-results.json
      - name: Upload eval results
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: backend/eval-results.json

  ownership:
    name: CODEOWNERS present
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check CODEOWNERS exists and names an owner
        run: |
          test -f .github/CODEOWNERS
          grep -q '^\* @' .github/CODEOWNERS
