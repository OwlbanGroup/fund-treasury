# Fly.io configuration for the Fund Treasury frontend (deploy from frontend/).
app = "fund-treasury-web"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"
  # NOTE: pass the API URL at deploy time, e.g.:
  #   flyctl deploy --build-arg VITE_API_URL=https://fund-treasury-api.fly.dev

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/"
